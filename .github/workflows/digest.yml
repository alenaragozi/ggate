name: Weekly digest ggm_news

on:
  schedule:
    - cron: "0 15 * * 5"   # каждую пятницу в 18:00 по Москве (15:00 UTC)
  workflow_dispatch:        # кнопка ручного запуска

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANNEL: ggm_news
          # Контрольные каналы через запятую, например: "channel_one,channel_two"
          CONTROL_CHANNELS: ""
          DAYS: "7"
          TOP_N: "7"
          MAX_PER_COUNTRY: "2"
          MAX_PER_CATEGORY: "3"
          SEND_REPORT: "1"   # 1 – присылать справку с баллами, 0 – не присылать
